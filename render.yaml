services:
  - type: web
    name: mbc-searxng
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./searxng/Dockerfile
    dockerContext: ./searxng
    healthCheckPath: /
    envVars:
      - key: SEARXNG_SECRET
        sync: false

  - type: web
    name: mbc-b2b-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WORKER_TOKEN
        sync: false
      - key: SEARXNG_INTERNAL_URL
        value: https://mbc-searxng-zhfg.onrender.com
      - key: PORT
        value: 8787
