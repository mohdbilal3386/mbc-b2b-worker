use_default_settings: true

server:
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  formats:
    - html
    - json

# The default settings ship with most general engines disabled. Turn on the
# ones that tend to work from datacenter IPs; others are blocked or CAPTCHA'd.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: qwant
    disabled: false
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: google
    disabled: false
  - name: yep
    disabled: false
  - name: crowdview
    disabled: false
